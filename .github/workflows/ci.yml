name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm install

    - name: Install frontend dependencies
      run: npm --prefix frontend install

    - name: Compile TypeScript
      run: npm run compile

    - name: Run tests
      run: npm test

    - name: Build frontend
      run: npm run frontend:build
      env:
        VITE_CONTRACT_ADDRESS: ${{ secrets.VITE_CONTRACT_ADDRESS }}
        VITE_INDEXER_URL: ${{ secrets.VITE_INDEXER_URL }}
        VITE_NETWORK: ${{ secrets.VITE_NETWORK }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Vercel
      if: env.VERCEL_TOKEN != ''
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
        vercel-args: '--prod'
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    - name: Native Vercel Integration Notice
      if: env.VERCEL_TOKEN == ''
      run: echo "VERCEL_TOKEN secret is not set in GitHub repository secrets. Deployment handled automatically via Vercel GitHub integration."
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
